

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
       // classpath 'com.android.tools.build:gradle:7.x.x' // إصدار Gradle المناسب
     
     
       // classpath 'com.google.gms:google-services:4.3.8' // أضف هذا السطر هنا

       classpath 'com.google.gms:google-services:4.4.2'
    }
}





allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
